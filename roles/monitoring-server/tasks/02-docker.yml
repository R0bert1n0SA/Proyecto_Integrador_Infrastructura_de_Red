--- 
- name: Instalar dependencias de Docker 
  apt: name: 
      - ca-certificates 
      - curl 
      - gnupg state: present 
   update_cache: yes 

- name: Agregar GPG key de Docker 
  shell: | install -m 0755 -d /etc/apt/keyrings curl -fsSL https://download.docker.com/linux/ubuntu/gpg \ | gpg --dearmor -o /etc/apt/keyrings/docker.gpg chmod a+r /etc/apt/keyrings/docker.gpg args: creates: /etc/apt/keyrings/docker.gpg 

- name: Agregar repositorio de Docker 
  shell: | echo "deb [arch=$(dpkg --print-architecture) \ signed-by=/etc/apt/keyrings/docker.gpg] \ https://download.docker.com/linux/ubuntu \ $(lsb_release -cs) stable" \ | tee /etc/apt/sources.list.d/docker.list args: creates: /etc/apt/sources.list.d/docker.list 

- name: Instalar Docker Engine 
   apt: name: 
       - docker-ce 
       - docker-ce-cli 
       - containerd.io 
       - docker-compose
       -plugin state: present 
   update_cache: yes 

- name: Habilitar y arrancar Docker 
  service: 
       name: docker 
  state: started enabled: yes
